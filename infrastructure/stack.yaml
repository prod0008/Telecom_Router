AWSTemplateFormatVersion: '2010-09-09'
Description: DynamoDB routing-audit table for telecom router project

Resources:
  RoutingAuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: routing-audit
      AttributeDefinitions:
        - AttributeName: ticket_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: ticket_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
